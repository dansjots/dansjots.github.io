<!DOCTYPE html>
<head id="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="robots" content="nofollow, noindex">
  <link rel="stylesheet" href="/temml.css">
  <style>
    :root {
      overflow-y: scroll;
      font-size: 125%;
      max-width: 80ch;
      margin: 0 auto;
    }
    body {
      margin-top: 0;
    }
    main {
      line-height: 1.5;
    }
  </style>
  
  <style></style>
  <title id="title">Remarks by year | Dan&apos;s Jots</title>
  <script>
  if (window?.matchMedia?.('(prefers-color-scheme:dark)')?.matches && localStorage.getItem('dark-mode')) {
    meta = document.createElement('meta');
    meta.setAttribute('name', 'color-scheme');
    meta.setAttribute('content', 'light dark');
    document.currentScript.replaceWith(meta);
  } else {
    document.currentScript.outerHTML = '';
  }
  </script>

</head>
<body id="body">
  
  <nav>
    <a href="/">Home</a>
    |
    <a href="/posts/">Posts</a>
    
    |
    <a href="/remarks/2025/">Remarks</a>
    
    <script>
    if (window?.matchMedia?.('(prefers-color-scheme:dark)')?.matches) {
      let toggle = document.createElement('a');
      toggle.href = document.location;
      toggle.textContent = localStorage.getItem('dark-mode') ? 'Dark' : 'Light';
      toggle.style.position = 'absolute';
      toggle.style.right = 0;
      toggle.onclick = function(e) {
        e.preventDefault();
        let meta = document.querySelector('meta[name=color-scheme]');
        if (meta) {
          meta.outerHTML = '';
          toggle.textContent = 'Light';
          localStorage.removeItem('dark-mode');
        } else {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'color-scheme');
          meta.setAttribute('content', 'light dark');
          document.head.appendChild(meta);
          toggle.textContent = 'Dark';
          localStorage.setItem('dark-mode', 1);
        }
      };
      document.currentScript.parentElement.style.position = 'relative';
      document.currentScript.replaceWith(toggle);
    } else {
      document.currentScript.outerHTML = '';
    }
    </script>
  </nav>
  <h1>Remarks by year</h1>
  <main id="main">
    
  <ul>
    <li>
        2025
        <a href="/remarks/2025/">Remarks</a>
    </li>
  </ul>

  </main>

</body>
